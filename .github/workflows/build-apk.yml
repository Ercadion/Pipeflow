name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Chaquopy 는 앱에 넣을 Python 과 같은 버전의 Python 으로 pip 설치/컴파일을 수행
      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Core algorithm quick test (numpy)
        run: |
          pip install numpy
          python android-app/core_tests/test_quick.py

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: android-app
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android-app/app/build/outputs/apk/release/*.apk "dist/PipeFlow-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.apk"
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PipeFlow-apk
          path: dist/*.apk

      - name: GitHub Release (태그 v* 일 때)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
