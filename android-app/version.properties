# ─────────────────────────────────────────────────────────────
# PipeFlow 앱 버전 — 배포(커밋)할 때 여기만 직접 고치면 됩니다
#   예) 0.3.5 → 0.3.6 (작은 수정), 0.4.0 (큰 기능)
# 빌드하면 이 값이 앱 첫 화면, 측정 폴더 이름(_v버전), meta.json, 분석 결과에 자동으로 기록됩니다.
# 설치 업데이트용 번호(versionCode)는 GitHub Actions 빌드 번호로 자동 증가하므로 신경 쓰지 않아도 됩니다.
# 빌드한 커밋 해시도 자동으로 함께 기록됩니다(app_build).
# ─────────────────────────────────────────────────────────────
versionName=0.3.8
